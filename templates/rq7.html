<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>jade.tools</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#000;min-height:100vh;overflow:auto;
    display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",ui-monospace,"Cascadia Code","Segoe UI Mono",Consolas,monospace;
  }
  .a{position:relative;width:640px;height:480px;flex:none}
  .a img{display:block;width:640px;height:480px}
  .b{position:absolute;left:232px;top:70px;width:226px;height:200px;cursor:pointer}

  .c{position:fixed;top:16px;right:16px;z-index:5;display:flex;align-items:center;gap:8px;
       background:rgba(16,16,16,.6);border:1px solid #3a3a3a;border-radius:12px;padding:8px 12px}
  .c svg{width:16px;height:16px;fill:none;stroke:#e3e3e3;stroke-width:1.8;
           stroke-linecap:round;stroke-linejoin:round;flex:none}
  .c input[type=range]{width:104px;accent-color:#21c98a;cursor:pointer;background:transparent}

  .d{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
       max-width:480px;width:calc(100% - 40px);z-index:10;
       background:#181818;border:1px solid #3a3a3a;border-radius:18px;
       padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.6);cursor:pointer}
  .d.hidden{display:none}
  .e{color:#e3e3e3;font-size:13.5px;line-height:1.6}
  .f{display:flex;gap:10px;margin-top:14px}
  .f.hidden{display:none}
  .f button{
    flex:1;cursor:pointer;border:1px solid transparent;border-radius:12px;
    padding:12px 14px;font-size:13px;font-weight:500;font-family:inherit;
    background:#21c98a;color:#06150f;transition:opacity .15s;
  }
  .f button:hover{opacity:.82}
  .f button.ghost{background:#222;color:#e3e3e3;border-color:#3a3a3a}
</style>
</head>
